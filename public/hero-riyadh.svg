<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Riyadh skyline at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F15"/>
      <stop offset="0.42" stop-color="#101A26"/>
      <stop offset="0.72" stop-color="#1C3A55"/>
      <stop offset="0.88" stop-color="#3A6EA5"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.66" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#E7C77A" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C9A24B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26465F"/><stop offset="1" stop-color="#1B3349"/></linearGradient>
    <linearGradient id="t-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2C3D"/><stop offset="1" stop-color="#0E1B27"/></linearGradient>
    <linearGradient id="t-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1822"/><stop offset="1" stop-color="#070C12"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0F15" stop-opacity="0"/><stop offset="1" stop-color="#070C12" stop-opacity="0.9"/></linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#dusk)"/>

  <!-- far hazy skyline -->
  <g fill="url(#t-far)" opacity="0.7">
    <rect x="60" y="640" width="60" height="440"/><rect x="150" y="690" width="44" height="390"/>
    <rect x="230" y="610" width="70" height="470"/><rect x="330" y="700" width="40" height="380"/>
    <rect x="1500" y="660" width="58" height="420"/><rect x="1590" y="700" width="46" height="380"/>
    <rect x="1680" y="630" width="66" height="450"/><rect x="1790" y="690" width="50" height="390"/>
  </g>

  <!-- mid skyline -->
  <g fill="url(#t-mid)">
    <rect x="120" y="560" width="78" height="520"/><rect x="300" y="600" width="64" height="480"/>
    <rect x="400" y="540" width="90" height="540"/><rect x="1410" y="560" width="84" height="520"/>
    <rect x="1540" y="600" width="60" height="480"/><rect x="1640" y="520" width="92" height="560"/>
    <!-- Al Faisaliyah-style tapering tower with sphere -->
    <polygon points="560,1080 600,470 640,1080"/>
    <circle cx="600" cy="452" r="22"/>
    <rect x="598" y="360" width="4" height="80"/>
  </g>

  <!-- foreground iconic cluster -->
  <g fill="url(#t-near)">
    <!-- Kingdom Tower: slab with the signature top opening (two legs + bridge) -->
    <rect x="760" y="300" width="58" height="780"/>
    <rect x="980" y="300" width="58" height="780"/>
    <path d="M760,300 q139,-150 278,0 v70 q-139,-120 -278,0 z"/>
    <!-- central business towers -->
    <rect x="700" y="540" width="52" height="540"/>
    <rect x="1050" y="500" width="70" height="580"/>
    <rect x="1130" y="600" width="48" height="480"/>
    <rect x="1200" y="440" width="80" height="640"/>
    <rect x="1300" y="560" width="56" height="520"/>
    <!-- a tapered KAFD-style tower -->
    <polygon points="640,1080 672,520 704,520 736,1080"/>
  </g>

  <!-- warm window lights -->
  <g fill="#E7C77A" opacity="0.5">
    <rect x="775" y="420" width="6" height="9"/><rect x="790" y="470" width="6" height="9"/><rect x="775" y="560" width="6" height="9"/>
    <rect x="998" y="440" width="6" height="9"/><rect x="1012" y="520" width="6" height="9"/><rect x="998" y="640" width="6" height="9"/>
    <rect x="1215" y="500" width="6" height="9"/><rect x="1238" y="580" width="6" height="9"/><rect x="1215" y="700" width="6" height="9"/>
    <rect x="1068" y="560" width="6" height="9"/><rect x="1086" y="660" width="6" height="9"/>
    <rect x="430" y="600" width="6" height="9"/><rect x="446" y="680" width="6" height="9"/>
    <rect x="1660" y="580" width="6" height="9"/><rect x="1690" y="660" width="6" height="9"/>
  </g>

  <rect x="0" y="720" width="1920" height="360" fill="url(#haze)"/>
</svg>
